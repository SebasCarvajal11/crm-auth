name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: crm_database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d crm_database"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://root:rootpassword@127.0.0.1:5432/crm_database
      NODE_ENV: test
      EXPOSE_TEMP_PASSWORDS: "true"
      PORT: "3000"
      REFRESH_COOKIE_PATH: /auth/refresh
      MAIL_TRANSPORT: log
      APP_PUBLIC_URL: http://localhost:5173
      ADMIN_INVITE_SECRET: test-admin-secret-123

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env file
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { generateKeyPairSync } = require('node:crypto');
          const { privateKey, publicKey } = generateKeyPairSync('rsa', {
            modulusLength: 2048,
            publicKeyEncoding: { type: 'spki', format: 'pem' },
            privateKeyEncoding: { type: 'pkcs8', format: 'pem' },
          });
          const esc = (pem) => JSON.stringify(pem.trimEnd());
          const lines = [
            `DATABASE_URL=${process.env.DATABASE_URL}`,
            `NODE_ENV=${process.env.NODE_ENV}`,
            `EXPOSE_TEMP_PASSWORDS=${process.env.EXPOSE_TEMP_PASSWORDS}`,
            `PORT=${process.env.PORT}`,
            `REFRESH_COOKIE_PATH=${process.env.REFRESH_COOKIE_PATH}`,
            `MAIL_TRANSPORT=${process.env.MAIL_TRANSPORT}`,
            `APP_PUBLIC_URL=${process.env.APP_PUBLIC_URL}`,
            `ADMIN_INVITE_SECRET=${process.env.ADMIN_INVITE_SECRET}`,
            `JWT_PRIVATE_KEY=${esc(privateKey)}`,
            `JWT_PUBLIC_KEY=${esc(publicKey)}`,
            'JWT_KID=mod-auth-rsa-1',
          ];
          fs.writeFileSync('.env', `${lines.join('\n')}\n`);
          NODE

      - name: Build
        run: pnpm build

      - name: Prepare schema
        run: pnpm db:push

      - name: Start auth server
        shell: bash
        run: |
          pnpm start > auth.log 2>&1 &
          echo $! > auth.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "auth server did not become healthy"
          cat auth.log
          exit 1

      - name: Reset test users
        run: pnpm exec tsx src/scripts/reset-test-users.ts

      - name: Run Hurl auth suite
        shell: bash
        run: |
          docker run --rm --network host -v "$PWD:/work" -w /work ghcr.io/orange-opensource/hurl:latest \
            --test --jobs 1 \
            tests/01_login.hurl \
            tests/02_me.hurl \
            tests/03_register_worker.hurl \
            tests/04_invite_client.hurl \
            tests/05_refresh_logout.hurl \
            tests/06_password_reset.hurl \
            tests/08_rbac.hurl

      - name: Print auth log on failure
        if: failure()
        shell: bash
        run: |
          test -f auth.log && cat auth.log || true

      - name: Stop auth server
        if: always()
        shell: bash
        run: |
          test -f auth.pid && kill "$(cat auth.pid)" || true
