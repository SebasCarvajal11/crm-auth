name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: SebasCarvajal11/crm-infra/.github/workflows/reusable-ci.yml@main
    with:
      component: auth
      runs_db: true
      runs_redis: true
      db_schema: schema_auth
      test_command: pnpm test
      install_hurl: true
    secrets: inherit
